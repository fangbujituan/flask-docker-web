[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v
tb = short
timeout = 30
minversion = 6.0
filterwarnings = ignore::DeprecationWarning

[tool:pytest]
markers = 
	smoke: 冒烟测试 - 基本功能验证
	regression: 回归测试 - 验证已有功能
	integration: 集成测试 - 测试模块间协作
	slow: 慢速测试 - 需要较长时间运行
	error_handling: 错误处理测试
	fixture_test: fixture测试
	api_test: API接口测试
	database_test: 数据库测试
	security_test: 安全测试
	performance_test: 性能测试
	ui_test: 用户界面测试
	custom_marker: 自定义标记测试
	high_priority: 高优先级测试
	low_priority: 低优先级测试
	timeout: 超时测试

