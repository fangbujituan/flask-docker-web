version: '3.8'

services:
  web:
    build: .
    ports:
      - "22048:22048"
    environment:
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=你的MySQL密码
      - MYSQL_DATABASE=design
      - SECRET_KEY=your_production_secret_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
