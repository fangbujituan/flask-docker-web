networks:
  vplatform_net:
    driver: bridge

services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    networks:
      - vplatform_net
    environment:
      # 自动读取你服务器本地 .env 里的密码
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    # 数据持久化
    volumes:
      - /opt/vplatform/mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  flask-app:
    build: .
    container_name: flask-docker-web-flask-app-1 # 改回你原先系统默认生成的或指定的容器名
    networks:
      - vplatform_net
    ports:
      - "22048:22048"
    environment:
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=design
      - SECRET_KEY=your_production_secret_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 利用 Python 原生无依赖 socket 探测 22048 端口，确保 Flask 彻底启动
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 22048))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    build: ./client
    container_name: nginx-frontend
    restart: always
    networks:
      - vplatform_net
    ports:
      - "808:80"
    depends_on:
      flask-app:
        condition: service_healthy # 严格依赖 flask-app 的健康检查结果